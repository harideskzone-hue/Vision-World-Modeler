name: Vision World Modeler - Deterministic Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install light dependencies required for deterministic test suites
          pip install pytest pydantic pyyaml numpy psutil

      - name: Execute Verification Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          FORCE_CPU: 1
        run: |
          pytest tests/test_corrections.py tests/test_room_revisit_change.py -v
